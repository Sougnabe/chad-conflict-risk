[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chadrisk"
version = "1.0.0"
description = "Farmer-herder conflict risk estimation for southern Chad (ALU capstone)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sougnabe" }]

[tool.setuptools.packages.find]
include = ["chadrisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::UserWarning"]
